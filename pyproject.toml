[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
# Existing code is not reformatted in Phase 0; tighten later.
ignore = ["E501", "E701", "E702", "E731", "E741"]
